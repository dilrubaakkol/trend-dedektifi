# Trend Dedektifi veri kataloğu (Kişi 1). Yeni değişken = yeni kayıt; kod değişmez.
#
# urunler: NASA ürünleri. short_name / version / doi / daac / valid_start CMR'den
#   (earthaccess.search_datasets) doğrulanmıştır (2026-11-14). "dogrulanmadi: true" olan alan
#   CMR'de bulunamamış ya da henüz bir dosyada görülmemiştir; ayrıntı "not" alanında.
# degiskenler: sözleşmedeki Türkçe ASCII ad × ürün. "ana: true" = data.load() varsayılanı.
#   dosya_degiskeni dosyanın içinde görülerek doğrulanmıştır (dogrulanmadi: false ise).
#
# erisim:
#   opendap  — Cloud OPeNDAP (DAP4): Türkiye kesiti sunucuda alınır, yalnız o indirilir (en hızlı)
#   stream   — earthaccess.open ile yalnızca Türkiye kesiti okunur (NetCDF4/HDF5 ürünler)
#   download — dosya tam indirilir, Türkiye'ye kesilir; keep_raw: false ise ham dosya silinir (HDF4)
# okuyucu (data/fetch.py): netcdf | hdf5_grid | hdfeos5_grid | hdf4_cmg | srtm_dem
# durum: aktif | ertelendi (neden "not" içinde)
# donusum (data/harmonize.py UNIT_CONVERSIONS): yok, K_to_C, Pa_to_hPa, kg_m2_s_to_mm_ay,
#   acc3h_to_mm_ay, mm_saat_to_mm_ay, kesir_to_yuzde, olcek (ham*olcek + ofset), molek_to_1e15
# mekansal_cozunurluk: derece (enlem, boylam)

bbox: [25.0, 34.5, 45.5, 43.0]      # batı, güney, doğu, kuzey (TURKIYE_BBOX)
donem: ["2001-01", "2025-12"]

