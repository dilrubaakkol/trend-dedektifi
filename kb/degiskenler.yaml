# Değişken kartları. "ad" alanı docs/sozlesmeler.md tablosundaki değişken adıyla BİREBİR aynı olmalı.
# sade_tanim: lise öğrencisinin anlayacağı dil. anahtar_kelimeler: planlayıcının yedek eşleştirmesi.
- ad: kar_ortusu
  baslik: Kar örtüsü
  birim: "%"
  ana_urun: MOD10CM
  sade_tanim: Bir bölgenin ay boyunca ortalama ne kadarının karla kaplı olduğu.
  anahtar_kelimeler: ["kar örtüsü", "karla kaplı"]
  dikkat: Bulutlu günlerde uydu yeri göremez; aylık üründe bu boşluklar azalır ama kaybolmaz.
- ad: kar_su_esdegeri
  baslik: Kar su eşdeğeri
  birim: mm
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Yerdeki kar eriseydi kaç milimetre su olurdu; barajlara gidecek suyun göstergesi.
  anahtar_kelimeler: ["kar suyu", "kar su", "kar kalınlığı"]
  dikkat: Model ürünüdür, doğrudan ölçüm değildir.
- ad: sicaklik_2m
  baslik: Hava sıcaklığı (2 m)
  birim: "°C"
  ana_urun: M2TMNXSLV
  ikincil_urunler: [GLDAS_NOAH025_M, AIRS3STM]
  sade_tanim: Yerden 2 metre yükseklikteki hava sıcaklığı, yani termometrenin gösterdiği.
  anahtar_kelimeler: ["sıcaklık", "ısın", "sıcak", "soğu"]
  dikkat: Yaklaşık 25-50 km'lik hücrelerin ortalamasıdır; şehir içi farkları göremez.
- ad: ozgul_nem_2m
  baslik: Havadaki nem
  birim: kg/kg
  ana_urun: M2TMNXSLV
  sade_tanim: Her kilogram havada kaç kilogram su buharı olduğu.
  anahtar_kelimeler: ["nem", "rutubet"]
  dikkat: Bağıl nemden farklıdır; havadaki suyun gerçek miktarını gösterir.
- ad: yagis
  baslik: Yağış
  birim: mm/ay
  ana_urun: GPM_3IMERGM
  ikincil_urunler: [M2TMNXFLX, GLDAS_NOAH025_M]
  sade_tanim: Bir ayda düşen yağmur ve karın toplam su miktarı.
  anahtar_kelimeler: ["yağış", "yağmur", "yağ"]
  dikkat: Dağlık bölgelerde kar yağışını eksik ölçebilir; bu yüzden üç ürün karşılaştırılır.
- ad: buharlasma
  baslik: Buharlaşma
  birim: mm/ay
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Topraktan, sudan ve bitkilerden havaya geri dönen su miktarı.
  anahtar_kelimeler: ["buharlaş", "terleme"]
  dikkat: Model ürünüdür.
- ad: yuzey_akisi
  baslik: Yüzey akışı
  birim: mm/ay
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Toprağa sızmayıp derelere ve nehirlere akan su.
  anahtar_kelimeler: ["akış", "dere", "nehir"]
  dikkat: Barajlar ve sulama modele dahil değildir.
- ad: toprak_nemi
  baslik: Toprak nemi
  birim: kg/m²
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Toprağın içinde tutulan su; bitkilerin kullandığı su deposu.
  anahtar_kelimeler: ["toprak nemi", "toprak"]
  dikkat: Model ürünüdür; sulama etkisini içermez.
- ad: ndvi
  baslik: Bitki örtüsü (NDVI)
  birim: "-"
  ana_urun: MOD13C2
  sade_tanim: Bitkilerin ne kadar yeşil ve gür olduğunu gösteren, -1 ile 1 arasında bir sayı.
  anahtar_kelimeler: ["ndvi", "yeşil", "bitki"]
  dikkat: Tarım takvimi ve sulama NDVI'yi güçlü etkiler.
- ad: su_buhari_kolon
  baslik: Toplam su buharı
  birim: kg/m²
  ana_urun: AIRS3STM
  sade_tanim: Yerden atmosferin tepesine kadar havadaki tüm su buharı.
  anahtar_kelimeler: ["su buharı"]
  dikkat: AIRS bulutlu koşullarda daha belirsizdir.
- ad: toplam_su_depolama
  baslik: Toplam su deposu (GRACE)
  birim: cm
  ana_urun: GRACE/GRACE-FO JPL Mascon
  sade_tanim: Kar, toprak, göl ve yeraltı suyu dahil bir bölgedeki tüm suyun değişimi.
  anahtar_kelimeler: ["yeraltı", "yer altı", "su deposu", "grace"]
  dikkat: Çözünürlük kabadır (yaklaşık 300 km); küçük il ölçeğinde dikkatli yorumlanmalı.
- ad: rakim
  baslik: Rakım
  birim: m
  ana_urun: SRTMGL3
  sade_tanim: Bir yerin deniz seviyesinden yüksekliği.
  anahtar_kelimeler: ["rakım", "yükseklik"]
  dikkat: Analiz ekseni olarak kullanılır, trendi incelenmez.

# ---- docs/eksik_degiskenler.md ile eklenenler (2026-11-14) ----
- ad: ruzgar_u_10m
  baslik: Doğu-batı rüzgâr bileşeni (10 m)
  birim: m/s
  ana_urun: M2TMNXSLV
  sade_tanim: Rüzgârın doğu-batı yönündeki bileşeni; pozitif değer batıdan doğuya esen rüzgâr demektir.
  anahtar_kelimeler: ["doğu-batı rüzgâr", "zonal rüzgâr", "u bileşeni"]
  dikkat: Yön bileşenidir. Aylık ortalaması rüzgâr hızının ortalaması değildir; hız için ruzgar_hizi kullanılır.
- ad: ruzgar_v_10m
  baslik: Kuzey-güney rüzgâr bileşeni (10 m)
  birim: m/s
  ana_urun: M2TMNXSLV
  sade_tanim: Rüzgârın kuzey-güney yönündeki bileşeni; pozitif değer güneyden kuzeye esen rüzgâr demektir.
  anahtar_kelimeler: ["kuzey-güney rüzgâr", "meridyonel rüzgâr", "v bileşeni"]
  dikkat: Yön bileşenidir. U ve V bileşenlerinin aylık ortalamalarından hız hesaplanmamalıdır.
- ad: ruzgar_hizi
  baslik: Rüzgâr hızı
  birim: m/s
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Yere yakın rüzgârın aylık ortalama hızı.
  anahtar_kelimeler: ["rüzgâr hızı", "rüzgar hızı", "rüzgâr", "rüzgar"]
  dikkat: Yakın yüzey hızının aylık ortalamasıdır; fırtına gibi kısa olayları göstermez.
- ad: deniz_seviyesi_basinci
  baslik: Deniz seviyesine indirgenmiş basınç
  birim: hPa
  ana_urun: M2TMNXSLV
  sade_tanim: Havanın basıncı, yükseklik etkisi çıkarılarak deniz seviyesine göre hesaplanmış hali.
  anahtar_kelimeler: ["basınç", "hava basıncı", "yüksek basınç", "alçak basınç"]
  dikkat: Dolaşım değişimlerinin göstergesidir; tek başına hava olayı tahmini için kullanılmaz.
- ad: bulut_orani
  baslik: Bulut örtüsü
  birim: "%"
  ana_urun: M2TMNXRAD
  sade_tanim: Gökyüzünün ortalama ne kadarının bulutla kaplı olduğu.
  anahtar_kelimeler: ["bulut", "bulutluluk", "güneşlenme"]
  dikkat: Model (MERRA-2) ürünüdür; bulut türünü ve yüksekliğini ayırmaz.
- ad: yuzey_sicakligi_gunduz
  baslik: Gündüz kara yüzeyi sıcaklığı
  birim: "°C"
  ana_urun: MOD11C3
  sade_tanim: Uydunun gündüz ölçtüğü toprağın, kayanın ya da çatının yüzey sıcaklığı.
  anahtar_kelimeler: ["yüzey sıcaklığı", "gündüz yüzey", "lst", "kentsel ısı adası"]
  dikkat: Kara yüzeyinin sıcaklığıdır, hava sıcaklığı (sicaklik_2m) değildir; bulutlu günler ölçülemez.
- ad: yuzey_sicakligi_gece
  baslik: Gece kara yüzeyi sıcaklığı
  birim: "°C"
  ana_urun: MOD11C3
  sade_tanim: Uydunun gece ölçtüğü kara yüzeyinin sıcaklığı; şehirlerin geceleri ne kadar soğuyamadığını gösterir.
  anahtar_kelimeler: ["gece yüzey", "gece sıcaklığı"]
  dikkat: Kara yüzeyinin sıcaklığıdır, hava sıcaklığı (sicaklik_2m) değildir; bulutlu geceler ölçülemez.
- ad: evi
  baslik: Gelişmiş bitki indeksi (EVI)
  birim: "1"
  ana_urun: MOD13C2
  sade_tanim: NDVI'ye benzer bir yeşillik ölçüsü; çok yoğun bitki örtüsünde ve atmosfer etkisinde daha az doyuma ulaşır.
  anahtar_kelimeler: ["evi"]
  dikkat: NDVI ile birlikte yorumlanmalı; tarım takvimi ve sulama güçlü etkiler.
- ad: taban_akisi
  baslik: Taban akışı (yeraltı drenajı)
  birim: mm/ay
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Topraktan aşağı sızıp yeraltı yoluyla derelere ulaşan su.
  anahtar_kelimeler: ["taban akışı", "yeraltı drenajı", "baz akış"]
  dikkat: Model ürünüdür; yeraltı suyu çekimi ve barajlar modelde yoktur.
- ad: kok_bolgesi_nemi
  baslik: Kök bölgesi nemi
  birim: kg/m²
  ana_urun: GLDAS_NOAH025_M
  sade_tanim: Bitki köklerinin ulaştığı derinlikteki (yaklaşık 1 m) toprakta bulunan su.
  anahtar_kelimeler: ["kök bölgesi", "derin toprak nemi"]
  dikkat: Model ürünüdür; sulama etkisini içermez. Yüzey toprak nemiyle (toprak_nemi) karıştırılmamalı.
- ad: aerosol_optik_derinlik
  baslik: Aerosol optik derinliği (AOD)
  birim: "1"
  ana_urun: M2TMNXAER
  sade_tanim: Havadaki toz, duman ve kirletici parçacıkların güneş ışığını ne kadar engellediği; birimsizdir.
  anahtar_kelimeler: ["aerosol", "aod", "toz", "partikül", "pus"]
  dikkat: Model (MERRA-2) ürünüdür; yer seviyesindeki PM2.5 ile aynı şey değildir.
- ad: ozon_kolon
  baslik: Toplam ozon kolonu
  birim: DU
  ana_urun: M2TMNXSLV
  sade_tanim: Yerden atmosferin tepesine kadar havadaki toplam ozon miktarı (çoğu stratosferde).
  anahtar_kelimeler: ["ozon"]
  dikkat: Çoğunluğu stratosferik ozondur; yer seviyesindeki ozon kirliliğini göstermez. OMI ikincil ürünü ertelendi.
- ad: no2
  baslik: Troposferik azot dioksit (NO₂)
  birim: "10^15 molekül/cm²"
  ana_urun: OMNO2d
  sade_tanim: Trafik, sanayi ve ısınmadan kaynaklanan azot dioksitin havadaki toplam miktarı.
  anahtar_kelimeler: ["no2", "azot dioksit", "trafik kirliliği"]
  dikkat: Troposferik kolon; bulut oranı %30'un altındaki günlerden. Seri 2004-10'da başlar.
- ad: yanan_alan
  baslik: Yanan alan
  birim: "%"
  ana_urun: MCD64A1
  sade_tanim: Bir bölgede ay içinde yanan alanın oranı (orman ve tarım arazisi yangınları).
  anahtar_kelimeler: ["yangın", "yanan alan", "orman yangını"]
  dikkat: Ürün ertelendi; henüz veri yok.
  henuz_veri_yok: true
- ad: so2
  baslik: Kükürt dioksit (SO₂)
  birim: DU
  ana_urun: OMSO2e
  sade_tanim: Kömür yakımı, sanayi ve volkanlardan kaynaklanan kükürt dioksit miktarı.
  anahtar_kelimeler: ["so2", "kükürt dioksit"]
  dikkat: Ürün ertelendi; henüz veri yok.
  henuz_veri_yok: true
- ad: deniz_yuzey_sicakligi
  baslik: Deniz yüzeyi sıcaklığı
  birim: "°C"
  ana_urun: MODISA_L3m_SST
  sade_tanim: Deniz suyunun en üst tabakasının sıcaklığı.
  anahtar_kelimeler: ["deniz sıcaklığı", "deniz suyu sıcaklığı", "deniz yüzeyi"]
  dikkat: Ürün ertelendi; henüz veri yok.
  henuz_veri_yok: true
- ad: klorofil
  baslik: Klorofil-a
  birim: mg/m³
  ana_urun: MODISA_L3m_CHL
  sade_tanim: Denizdeki mikroskobik bitkilerin (fitoplankton) miktarının göstergesi; müsilaj ve aşırı besin yükü takibinde kullanılır.
  anahtar_kelimeler: ["klorofil", "fitoplankton", "müsilaj", "deniz salyası"]
  dikkat: Ürün ertelendi; henüz veri yok. Kıyıya yakın bulanık sularda belirsizlik yüksektir.
  henuz_veri_yok: true
