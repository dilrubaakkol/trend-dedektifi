# Süreç kartı. Yeni süreç = bu klasöre yeni bir YAML dosyası (aynı alanlarla).
# Planlayıcı (llm/plan.py) bu kartlardan beslenir; arayüz "sade_tanim"ı kullanıcıya gösterir.
id: kar_isinma
baslik: Kar örtüsü azalımı ve ısınma
konu: Kar
mevsim: kis   # varsayılan L3 mevsimi: kar kışın anlamlı (soruda başka mevsim geçerse o kullanılır)
buyukluk_testleri: [kar_cizgisi]   # L4_iliski/buyukluk/ (sözleşme 2.5)
sade_tanim: Isınan bir dağda kar çizgisi yukarı çekilir; alçak yerlerde kar azalır.
soru_kaliplari: ["kar", "kar örtüsü", "kar çizgisi", "kar eriyor", "kayak", "kar su"]
ornek_sorular:
  - "Doğu Anadolu'da kar nasıl değişiyor ve bu ısınmayla tutarlı mı?"
  - "Erzurum'da kar azalıyor mu?"
belirti:
  - degisken: kar_ortusu
    urun: MOD10CM
    beklenen_yon: azalis
  - degisken: kar_su_esdegeri
    urun: GLDAS_NOAH025_M
    beklenen_yon: azalis
supheliler:
  - degisken: sicaklik_2m
    urunler: [MERRA2, GLDAS, AIRS]
    neden: "Sıcaklık artınca kar erken erir ve yağış kar yerine yağmur olarak düşer."
  - degisken: yagis
    urunler: [GPM, MERRA2]
    neden: "Kış yağışı azalırsa daha az kar birikir."
fiziksel_test:
  tip: sinir_kaymasi
  eksen: rakim
  surucu: sicaklik_2m
alternatifler:
  - "Kış yağışı azalımı"
  - "Toz/kurum kaynaklı albedo düşüşü"
kaynaklar:
  - "IPCC SROCC (2019), Bölüm 2: Yüksek dağ bölgeleri"
