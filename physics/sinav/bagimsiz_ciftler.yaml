# Motorun bağımsız fizik sınavı — ÖN KAYIT (2026-11-15)
#
# Bu çiftler motorun geliştirilmesinde (ciftler.yaml'daki 6 çift) KULLANILMADI. Beklenen yönler
# motor bu çiftlerde çalıştırılmadan ÖNCE, fizik bilgisine göre yazıldı ve dosya sonradan değiştirilmez.
# Dosyanın SHA-256 özeti sınav çıktısına yazılır; özet farklıysa sınav geçersizdir.
#
# sinif:
#   kontrol : aynı büyüklüğün iki ayrı ölçümü ya da tanımca bağlı iki değişken. Motorun boru hattı doğru
#             çalışıyorsa bunlar NEREDEYSE KESİN beklenen yönde çıkar. Ters çıkarsa motorda hata vardır.
#   fizik   : bilinen fiziksel süreç; ilişki gerçek ama zayıf olabilir ("anlamsiz" başarısızlık değildir,
#             "ters_yonde" ise incelenir).
# bolge: tum_bolgeler (7 bölge + Türkiye, p < 0,05). Seri: motorun mevsim seçeneği.
#
# BAŞARI ÖLÇÜTÜ (önceden):
#   1) kontrol sınıfında Türkiye satırlarının hepsi beklenen_yonde; hiçbir satır ters_yonde değil.
#   2) fizik sınıfında Türkiye satırlarında ters_yonde sayısı ≤ 1 ve beklenen_yonde oranı ≥ %60.
#   Ölçüt tutmazsa sonuç "başarısız" diye raporlanır; çiftler ya da ölçüt değiştirilmez.

ciftler:
  # ---- kontrol
  - {no: K1, sinif: kontrol, x: [sicaklik_2m, MERRA2], y: [sicaklik_2m, GLDAS], mevsim: aylik, beklenen: "+",
